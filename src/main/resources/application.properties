spring.application.name=payguard

# In-memory H2 database (swap for Postgres in production)
spring.datasource.url=jdbc:h2:mem:payguard;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Fraud rules
payguard.fraud.high-amount-threshold=50000
payguard.fraud.velocity.max-per-window=3
payguard.fraud.velocity.window-seconds=60

# How many times to retry a transfer that lost an optimistic-lock race
payguard.transfer.max-retries=10
